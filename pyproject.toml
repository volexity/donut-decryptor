[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "donut-decryptor"
dynamic = ["version"]
description = "Decryptor for files containing Donut shellcode"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    { name = "Volexity", email = "threatintel@volexity.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "aplib",
    "chaskey",
    "lznt1",
    "yara-python>=4.5.0",
]

[project.urls]
Documentation = "https://github.com/volexity/donut-decryptor/blob/main/README.md"
Issues = "https://github.com/volexity/donut-decryptor/issues"
Source = "https://github.com/volexity/donut-decryptor"

[project.scripts]
donut-decryptor = "donut_decryptor.cli:run"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["donut_decryptor"]

[tool.hatch.build.hooks.vcs]
version-file = "donut_decryptor/_version.py"

[tool.mypy]
explicit_package_bases = true
files = ["donut_decryptor"]

[[tool.mypy.overrides]]
module = [
    "aplib.*",
    "lznt1.*",
    "yara.*"
]
ignore_missing_imports = true


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "FIX002",
    "FBT001",
    "FBT002",
    "FBT003",
    "TD002",
    "TD003",
    "TRY400",
]
